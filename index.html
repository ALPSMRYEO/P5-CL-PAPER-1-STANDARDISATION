<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雅德小学五年级写作评分标准统一化</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #fffbea 0%, #fef3c7 100%);
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 46px 34px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .10);
    }
    .school {
      font-size: 18px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.25;
      font-weight: 900;
      color: #0f172a;
    }
    .sub {
      margin: 14px 0 34px;
      font-size: 18px;
      color: #64748b;
    }
    .enter {
      display: inline-block;
      width: min(430px, 100%);
      padding: 18px 24px;
      border-radius: 16px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .20);
      transition: transform .15s ease, background .15s ease;
    }
    .enter:hover { background: #1d4ed8; transform: translateY(-1px); }
    .note {
      margin-top: 26px;
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="school">Alexandra Primary School · 雅德小学</div>
    <h1>五年级华文写作<br>评分标准统一化</h1>
    <div class="sub">Primary 5 Chinese Writing Standardisation</div>

    <a class="enter" href="P5_Standardisation_FINAL.html">
      进入评分系统
    </a>

    <div class="note">
      请选择进入评分系统后，再选择试卷编号及评卷老师进行评分。
    </div>
  </main>
</body>
</html>
